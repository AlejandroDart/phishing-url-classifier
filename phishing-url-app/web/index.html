<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LinkShield AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LinkShield AI</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #030b16;
    }

    #boot-loader {
      position: fixed;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 18px;
      color: #ffffff;
      font-family: monospace;
      text-align: center;
    }

    #boot-loader img {
      width: 72px;
      height: 72px;
      margin: 0 auto;
    }

    #boot-loader strong {
      color: #00e5ff;
      font-size: 18px;
      letter-spacing: 0;
    }

    #boot-loader span {
      width: 180px;
      height: 3px;
      overflow: hidden;
      background: #18314c;
    }

    #boot-loader span::after {
      display: block;
      width: 45%;
      height: 100%;
      background: #0a84ff;
      content: "";
      animation: boot-progress 1.1s ease-in-out infinite alternate;
    }

    @keyframes boot-progress {
      from { transform: translateX(-100%); }
      to { transform: translateX(225%); }
    }
  </style>
</head>
<body>
  <div id="boot-loader" aria-label="Cargando LinkShield AI">
    <img src="icons/Icon-192.png" alt="">
    <strong>LINKSHIELD AI</strong>
    <span aria-hidden="true"></span>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
